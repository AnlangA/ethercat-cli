[package]
name = "ethercat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI-ready EtherCAT protocol CLI: guarded SII/ESI EEPROM interface, pure-Rust Beckhoff SSC/OD codegen, Wireshark-compatible frame dissector, raw frame TX/RX, ESC registers, CoE SDO, and PDO field access"

[[bin]]
name = "ethercat-cli"
