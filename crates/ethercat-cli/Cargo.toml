[dependencies]
anyhow.workspace = true
clap.workspace = true
ethercat-eeprom.workspace = true
ethercat-master.workspace = true
ethercat-ssc.workspace = true
ethercat-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
