[workspace]
resolver = "2"
members = [
    "crates/ethercat-wire",
    "crates/ethercat-eeprom",
    "crates/ethercat-master",
    "crates/ethercat-ssc",
    "crates/ethercat-cli",
]
default-members = ["crates/ethercat-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
hex = "0.4"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

ethercat-wire = { path = "crates/ethercat-wire" }
ethercat-eeprom = { path = "crates/ethercat-eeprom" }
ethercat-master = { path = "crates/ethercat-master" }
ethercat-ssc = { path = "crates/ethercat-ssc" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
